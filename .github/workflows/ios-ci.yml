name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build iOS
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        working-directory: PureIPTV
        run: xcodebuild -resolvePackageDependencies -project PureIPTV.xcodeproj -scheme PureIPTV

      - name: Build iOS Simulator app
        working-directory: PureIPTV
        run: >-
          xcodebuild build
          -project PureIPTV.xcodeproj
          -scheme PureIPTV
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
